<text x="320.0" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="15.5" fill="#3d3a34">Chaque cellule est un anneau (beige) avec sa cellule intérieure (bleu)</text>
<text x="320.0" y="520" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#5c5850" font-style="italic">l’anneau est connexe, non simplement connexe, et de même diamètre que la cellule d’origine</text>
<text x="320.0" y="540" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#5c5850" font-style="italic">aire totale = aire du tore à 10⁻¹³ près ; ω reste égal à 7</text>
