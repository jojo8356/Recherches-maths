name = "geom"
version = "0.1.0"
defaultTargets = ["Geometrie"]

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "Geometrie"

[[lean_lib]]
name = "Pont"

[[lean_lib]]
name = "Queue"

[[lean_lib]]
name = "Boites"

# Boites_data est un fichier généré par note/gen_obligations.py (geste 40).
# Il DOIT être déclaré ici : Lake ne construit que des bibliothèques déclarées, et
# `lake build Boites_data` échoue avec « unknown target » sinon.
[[lean_lib]]
name = "Boites_data"

# Note : `packagesDir` et `buildDir` étaient fixés à /var/tmp/... pour le bac à sable de
# l'audit. Ces chemins n'existent pas ailleurs et faisaient échouer la création du dossier.
# On revient aux emplacements par défaut de Lake (.lake/ dans le projet).
